name: 🛠️ 自动构建 (Auto Build)

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 🛠️ 构建模组 (Build Mod)
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v7

      - name: 安装 Java (Install Java)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: 配置 Gradle (Setup Gradle)
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 Gradle Wrapper 执行权限 (Grant Gradle Wrapper Execute Permission)
        run: chmod +x gradlew

      - name: 运行 build 构建 (Run Gradle Build)
        run: ./gradlew build

      - name: 整理构建产物 (Prepare Build Artifacts)
        id: jar
        run: |
          jars=(build/libs/*.jar)
          if [ ${#jars[@]} -ne 1 ] || [ ! -f "${jars[0]}" ]; then
            echo "Expected exactly one jar in build/libs, found: ${jars[*]}" >&2
            exit 1
          fi
          # 文件名格式：<mod_id>-<loader>-<mc 版本>-<mod 版本>.jar
          version=${jars[0]##*-}
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "version=${version%.jar}" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物 (Upload Build Artifacts)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jar.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: 上传到 Pre-Release (Upload to Pre-Release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
          TAG: v${{ steps.jar.outputs.version }}
        run: |
          if ! is_prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease 2>/dev/null); then
            gh release create "$TAG" "$JAR_PATH" --prerelease --target main --title "$TAG" --notes ""
          elif [ "$is_prerelease" = "true" ]; then
            gh release upload "$TAG" "$JAR_PATH" --clobber
          else
            echo "${TAG} 已正式发布，请升级版本号！"
            exit 1
          fi
