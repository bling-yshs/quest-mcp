# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1]
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.3.19

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=questmcp
# The human-readable display name for the mod.
mod_name=Quest MCP
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GPL-3.0-only
# The mod version. See https://semver.org/
mod_version=0.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.yshs.questmcp

## Dependencies

# FTB Quests and the FTB mods it requires: https://maven.ftb.dev/releases/dev/ftb/mods/
# 2001.3.0 is Beta; 2001.3.1 is the first Release without a mandatory Item Filters dependency.
ftb_quests_version=2001.3.1
ftb_library_version=2001.1.4
ftb_teams_version=2001.1.4
# JEI: https://maven.blamejared.com/mezz/jei/
jei_version=15.0.0.12
architectury_version=9.1.12
# Minimum versions for Minecraft 1.20.1, independent of the compile and dev runtime versions above.
# Version ranges required at runtime, declared in mods.toml
forge_version_range=[47.3.19,48)
ftb_quests_version_range=[2001.3.1,2002)
jei_version_range=[15.0.0.12,16)

# Test dependencies
junit_version=5.14.4
# Libraries bundled with Minecraft 1.20.1, needed by the tests of the Minecraft-free core
gson_version=2.10
slf4j_version=2.0.1
